name: rates

# Snapshot de tasas ConsuTasas: BCV + Binance P2P + Bybit P2P -> rates.json
# publicado en la rama `data` (un solo commit, force-push).
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rates-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Build rates.json
        run: python scripts/build_rates.py --out rates.json

      - name: Publish to data branch (single commit, force-push)
        run: |
          mkdir -p /tmp/publish
          cd /tmp/publish
          git init -q -b data
          git config user.name "consutasas-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          cp "${{ github.workspace }}/rates.json" rates.json
          git add rates.json
          git commit -q -m "rates: update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push --force origin data
